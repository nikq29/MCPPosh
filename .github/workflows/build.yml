name: Build, test and release

# Sampler pipeline:
#   build   -> ./build.ps1 -Tasks pack (module + nupkg, version from GitVersion)
#   test    -> ./build.ps1 -Tasks test on Windows, Linux and macOS (QA, unit, integration, coverage)
#   publish -> ./build.ps1 -Tasks publish (PowerShell Gallery + GitHub release), only for tags v*
#   docker  -> image validated with the built package; on tags v* built from the Gallery and pushed to GHCR
#
# Required repository secret for releases: GALLERY_API_TOKEN (PowerShell Gallery API key).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_ROLL_FORWARD: Major

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate the module version with GitVersion
        id: version
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          $gitVersion = dotnet-gitversion | ConvertFrom-Json
          "Module version: $($gitVersion.NuGetVersionV2)"
          "version=$($gitVersion.NuGetVersionV2)" >> $env:GITHUB_OUTPUT

      - name: Build and package the module (Sampler)
        shell: pwsh
        env:
          ModuleVersion: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -ResolveDependency -Tasks pack -UseModuleFast

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: output
          path: |
            output/module/
            output/*.nupkg
            output/ReleaseNotes.md
            output/CHANGELOG.md
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: output
          path: output

      - name: Run the tests (Sampler)
        shell: pwsh
        env:
          ModuleVersion: ${{ needs.build.outputs.version }}
        run: ./build.ps1 -ResolveDependency -Tasks test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults/
          if-no-files-found: ignore

  analyze:
    name: Analyze documentation and deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Bicep template
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null

      - name: Lint the Markdown documentation
        run: npx --yes markdownlint-cli2@0.17.2

      - name: Run PSScriptAnalyzer on the docker and deploy scripts
        shell: pwsh
        run: |
          Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery -TrustRepository -Quiet
          $results = foreach ($path in './docker', './deploy') { Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 }
          $results | Format-Table -AutoSize -Property Severity, RuleName, ScriptName, Line, Message | Out-String -Width 250
          if (@($results | Where-Object Severity -EQ 'Error').Count -gt 0) { throw 'PSScriptAnalyzer found errors.' }

  docker:
    name: Docker image (built package)
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: output
          path: output

      - name: Provide the package to the image build
        run: cp output/*.nupkg docker/packages/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image from the built package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: PSMCPKB_SOURCE=Local
          load: true
          tags: psmcpkb:ci

      - name: Smoke test the container
        shell: pwsh
        run: |
          docker run -d --name psmcpkb -p 8080:8080 -e PSMCPKB_API_KEY=ci-key psmcpkb:ci | Out-Null
          $deadline = (Get-Date).AddSeconds(60)
          do {
              Start-Sleep -Seconds 2
              try { $health = Invoke-RestMethod -Uri http://localhost:8080/health -Headers @{ Authorization = 'Bearer ci-key' } } catch { $health = $null }
          } until ($health -or (Get-Date) -gt $deadline)
          docker logs psmcpkb
          if (-not $health) { throw 'The container did not become healthy.' }
          $body = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          $tools = Invoke-RestMethod -Uri http://localhost:8080/mcp -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = 'Bearer ci-key' }
          $tools.result.tools.name
          if ($tools.result.tools.name -notcontains 'search_documentation') { throw 'search_documentation is missing.' }
          $unauthorized = Invoke-WebRequest -Uri http://localhost:8080/mcp -Method Post -Body $body -ContentType 'application/json' -SkipHttpErrorCheck
          if ($unauthorized.StatusCode -ne 401) { throw "Expected 401 without API key, got $($unauthorized.StatusCode)." }

      # The release pushes amd64 and arm64. Build arm64 here too, so platform problems show up
      # before a tag instead of after the Gallery release (QEMU emulation).
      - name: Build the arm64 image from the built package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          build-args: PSMCPKB_SOURCE=Local
          load: true
          tags: psmcpkb:ci-arm64

      - name: Check PowerShell and the module in the arm64 image
        run: |
          docker run --rm --platform linux/arm64 --entrypoint pwsh psmcpkb:ci-arm64 -NoProfile -Command '
            $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
            Import-Module PSMcpKnowledgeBase -ErrorAction Stop
            "PowerShell {0} on {1}, PSMcpKnowledgeBase {2}" -f $PSVersionTable.PSVersion, $arch, (Get-Module PSMcpKnowledgeBase).Version
            if ("$arch" -ne "Arm64") { throw "Expected Arm64, got $arch." }'

  publish:
    name: Publish to the PowerShell Gallery
    needs: [build, test, analyze]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: output
          path: output

      - name: Publish the module and the GitHub release (Sampler)
        shell: pwsh
        env:
          ModuleVersion: ${{ needs.build.outputs.version }}
          GalleryApiToken: ${{ secrets.GALLERY_API_TOKEN }}
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -ResolveDependency -Tasks publish

  docker-release:
    name: Docker image (from the PowerShell Gallery)
    needs: [build, publish]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/psmcpkb
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.build.outputs.version, '-') }}

      - name: Build and push the image with PSMcpKnowledgeBase from the Gallery
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PSMCPKB_SOURCE=PSGallery
            PSMCPKB_VERSION=${{ needs.build.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
